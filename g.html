<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Gemini Code Power Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{--bg:#0b0d10;--panel:#111419;--panel2:#171a20;--panel3:#1d2129;--border:#292e38;--text:#f1f3f5;--muted:#9299a6;--accent:#8ab4f8;--accent2:#6ea8fe;--danger:#ff6b6b;--success:#67d391;--radius:16px;--shadow:0 12px 40px rgba(0,0,0,.28);--composer-space:275px}
*{box-sizing:border-box}

body{overflow:hidden;overscroll-behavior:none}

button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.material-symbols-rounded{font-family:"Material Symbols Rounded";font-weight:400;font-style:normal;font-size:20px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.app{width:100%;height:100dvh;display:flex;overflow:hidden;min-width:0}
.sidebar{width:280px;flex:0 0 280px;height:100%;background:#0d0f13;border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px;gap:12px;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:8px 4px 14px}
.brand-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#4285f4,#9b72cb);font-size:20px;box-shadow:0 8px 22px rgba(66,133,244,.2);flex:0 0 38px}
.brand-title{font-weight:700;font-size:15px}.brand-sub{color:var(--muted);font-size:11px;margin-top:2px}
.new-chat{width:100%;height:44px;border:1px solid var(--border);border-radius:12px;background:var(--panel2);color:var(--text);font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.new-chat:hover{background:var(--panel3)}
.sidebar-section{margin-top:5px}.sidebar-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#707784;padding:8px}.chat-list{overflow:auto;flex:1;min-height:0;scrollbar-width:thin}.chat-item{width:100%;border:0;background:transparent;color:#c8ccd4;padding:10px;text-align:left;border-radius:10px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-item:hover,.chat-item:focus-visible{background:var(--panel2)}
.sidebar-bottom{border-top:1px solid var(--border);padding-top:10px}
.api-status{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);padding:8px;min-height:32px}
.status-dot{width:7px;height:7px;border-radius:50%;background:#666;flex:0 0 7px}.status-dot.ok{background:var(--success);box-shadow:0 0 10px rgba(103,211,145,.55)}.status-dot.error{background:var(--danger)}
.sidebar-backdrop{display:none}
.main{min-width:0;flex:1;height:100%;display:flex;flex-direction:column;position:relative}
.topbar{min-height:62px;height:62px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--border);background:rgba(11,13,16,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:20;gap:10px}
.top-left,.top-right{display:flex;align-items:center;gap:8px;min-width:0}.top-left{flex:1 1 auto;overflow-x:auto;scrollbar-width:none}.top-left::-webkit-scrollbar,.top-right::-webkit-scrollbar{display:none}.top-right{flex:0 0 auto}
.mobile-menu{display:none}
.model-select,.thinking-select,.mode-select{height:36px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:0 10px;outline:none;max-width:210px;min-width:0}.thinking-select{min-width:145px}.model-select:focus,.thinking-select:focus,.mode-select:focus{border-color:#4d6f9e}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;flex:0 0 36px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);color:#cbd0d9;padding:0}.icon-btn:hover{background:var(--panel3)}
.chat{flex:1;min-height:0;overflow-y:auto;scroll-behavior:smooth;padding:24px 20px calc(var(--composer-space) + 28px);scrollbar-width:thin;scroll-padding-bottom:var(--composer-space)}
.chat-inner{width:min(100%,980px);margin:0 auto}
.welcome{min-height:calc(100dvh - 250px);display:flex;align-items:center;justify-content:center}
.welcome-card{width:min(720px,100%);text-align:center}.welcome-logo{width:58px;height:58px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#4285f4,#a66cff);font-size:28px;box-shadow:0 18px 45px rgba(70,110,255,.2)}
.welcome h1{margin:0 0 10px;font-size:clamp(25px,5vw,38px);letter-spacing:-.04em}.welcome p{color:var(--muted);margin:0 auto;max-width:600px;line-height:1.6}
.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:30px}.suggestion{text-align:left;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--border);color:#cdd2db}.suggestion:hover{background:var(--panel2)}.suggestion strong{display:block;color:#f4f5f7;margin-bottom:4px}
.message{display:flex;gap:12px;margin:0 auto 26px}.message.user{justify-content:flex-end}.avatar{width:32px;height:32px;flex:0 0 32px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--panel3);border:1px solid var(--border)}.message.user .avatar{order:2}
.message-body{min-width:0;max-width:calc(100% - 50px)}.message.user .message-body{max-width:min(850px,90%)}.message-text{line-height:1.65;color:#e6e8ec;overflow-wrap:anywhere}.message.user .message-text{background:#1a1f27;border:1px solid var(--border);padding:12px 15px;border-radius:17px}.thinking{color:#8d96a4;font-size:12px;padding:5px 0 10px}
.code-wrap{margin-top:12px;border:1px solid var(--border);border-radius:13px;overflow:hidden;background:#080a0d}.code-head{min-height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#111419;border-bottom:1px solid var(--border);gap:8px}.code-lang{color:#9da5b2;font-size:11px;font-family:"Roboto Mono",ui-monospace,monospace}.code-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.code-action{border:1px solid var(--border);background:#171a20;color:#bfc5cf;border-radius:7px;padding:4px 8px;font-size:11px}.code-action:hover{background:#222731}
pre{margin:0;overflow:auto;padding:15px;max-height:620px}code{font-family:"Roboto Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:13px;line-height:1.6;white-space:pre}.inline-code{background:#20242c;border-radius:5px;padding:2px 5px;font-family:"Roboto Mono",monospace}
.composer-zone{position:absolute;bottom:0;left:0;right:0;padding:14px 20px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,rgba(11,13,16,.96) 24%);pointer-events:none;z-index:15;overflow:visible}
.composer{pointer-events:auto;width:min(100%,980px);margin:0 auto;background:#15181e;border:1px solid #303640;border-radius:18px;box-shadow:var(--shadow);overflow:auto;max-height:min(46dvh,430px);overscroll-behavior:contain}
.editor-tabs{display:flex;align-items:center;gap:5px;padding:7px 9px 0;position:sticky;top:0;background:#15181e;z-index:2}.tab{border:0;background:transparent;color:#808896;padding:7px 9px;border-radius:8px;font-size:11px}.tab.active{color:#e5e8ed;background:#20242b}
.code-input-wrap{position:relative}#codeInput{display:block;width:100%;height:112px;resize:vertical;min-height:72px;max-height:25dvh;border:0;outline:none;background:transparent;color:#dfe3e8;padding:12px 15px 4px;font-family:"Roboto Mono","SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;font-size:13px;line-height:1.55;tab-size:2}.#codeInput::placeholder{color:#666e7b}
#codeInput::placeholder{color:#666e7b}.prompt-input{display:block;width:100%;min-height:54px;max-height:125px;resize:none;border:0;outline:none;background:transparent;color:var(--text);padding:12px 15px;line-height:1.5}
.composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px 9px;border-top:1px solid #252a32;position:sticky;bottom:0;background:#15181e;z-index:2}.composer-left,.composer-right{display:flex;align-items:center;gap:7px;min-width:0}.composer-left{flex:1 1 auto}.composer-right{flex:0 0 auto}
.small-btn{height:32px;padding:0 9px;border:1px solid var(--border);border-radius:9px;background:#1c2027;color:#aeb5c0;font-size:11px;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}.small-btn:hover{background:#252a32;color:#fff}
.counter{font-size:10px;color:#737b88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.send-btn{width:38px;height:38px;flex:0 0 38px;border:0;border-radius:11px;background:#f1f3f5;color:#101216;display:grid;place-items:center;font-size:17px;padding:0}.send-btn:hover{background:#fff;transform:translateY(-1px)}.send-btn.stop{background:#ff6b6b;color:#fff}
.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.68);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:100;padding:20px}.modal.open{display:grid}.modal-card{width:min(540px,100%);max-height:90dvh;overflow:auto;background:#15181e;border:1px solid var(--border);border-radius:18px;box-shadow:0 25px 80px rgba(0,0,0,.5)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:17px 18px;border-bottom:1px solid var(--border);gap:10px}.modal-title{font-weight:700}.modal-body{padding:18px}.field{margin-bottom:16px}.field label{display:block;color:#b8bec8;font-size:12px;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);background:#0f1216;color:#e9ebef;border-radius:10px;padding:10px 11px;outline:none}.field textarea{min-height:180px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#4e6f9d}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.primary-btn{border:0;background:#e8eaed;color:#111318;padding:9px 14px;border-radius:9px;font-weight:600}.secondary-btn{border:1px solid var(--border);background:#1a1e25;color:#cbd0d8;padding:9px 14px;border-radius:9px}
.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);background:#20242b;color:#e9ebef;border:1px solid #353b46;border-radius:10px;padding:10px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;z-index:200;box-shadow:var(--shadow);max-width:min(92vw,480px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:800px){
.sidebar{position:fixed;left:-290px;top:0;bottom:0;transition:left .22s ease;box-shadow:20px 0 60px rgba(0,0,0,.4);z-index:50}.sidebar.open{left:0}.sidebar-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.46);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility .2s ease;z-index:45}.sidebar-backdrop.open{opacity:1;visibility:visible;pointer-events:auto}
.topbar{height:auto;min-height:96px;flex-wrap:wrap;align-content:center;padding:8px;gap:6px}.top-left,.top-right{width:100%;flex:1 1 100%;overflow-x:auto;scrollbar-width:none;min-width:0}.top-right{justify-content:flex-start}.mobile-menu{display:grid}.model-select{max-width:48vw}.thinking-select{display:block;min-width:135px;max-width:45vw;font-size:11px;padding:0 7px}.mode-select{display:block;flex:1 1 auto;min-width:0;max-width:none}
.chat{padding:16px 11px calc(var(--composer-space) + 20px)}.message{gap:8px;margin-bottom:21px}.avatar{width:28px;height:28px;flex-basis:28px;border-radius:8px}.message-body{max-width:calc(100% - 40px)}.message.user .message-body{max-width:92%}
.composer-zone{padding:7px 8px calc(8px + env(safe-area-inset-bottom))}.composer{border-radius:15px;max-height:min(43dvh,360px)}#codeInput{height:94px;min-height:68px;max-height:20dvh}.prompt-input{min-height:50px;max-height:112px}.suggestions{grid-template-columns:1fr}.counter{max-width:34vw}.welcome{min-height:calc(100dvh - 330px)}.code-wrap pre{max-height:480px}
}
@media(max-width:500px){
.topbar{min-height:102px;padding:7px}.top-left,.top-right{gap:5px}.model-select{max-width:47vw;font-size:10px;padding:0 6px}.thinking-select{min-width:0;max-width:43vw;font-size:10px;padding:0 5px}.top-right .icon-btn{width:34px;height:34px;flex-basis:34px}.mode-select{height:34px;font-size:11px}.chat{padding-left:9px;padding-right:9px}.welcome h1{font-size:25px}.welcome p{font-size:13px}.composer{border-radius:14px;max-height:min(42dvh,330px)}#codeInput{height:84px;max-height:18dvh}.composer-bottom{padding:6px 7px 7px}.counter{display:none}.small-btn{padding:0 8px}.send-btn{width:36px;height:36px;flex-basis:36px}.code-action{font-size:10px;padding:4px 7px}.modal{padding:10px}.modal-card{border-radius:14px;max-height:94dvh}.modal-body{padding:15px}
}
@media(orientation:landscape) and (max-width:800px){
.topbar{min-height:78px}.composer{max-height:min(48dvh,320px)}#codeInput{height:76px;max-height:18dvh}.chat{padding-bottom:calc(var(--composer-space) + 14px)}
}
@media(prefers-reduced-motion:reduce){
*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar" aria-label="Conversation sidebar">
<div class="brand">
<div class="brand-icon" aria-hidden="true">✦</div>
<div><div class="brand-title">Gemini Code Studio</div><div class="brand-sub">Power coding assistant</div></div>
</div>

<button class="new-chat" id="newChatBtn" type="button">
<span class="material-symbols-rounded" aria-hidden="true">add</span>New chat
</button>

<div class="sidebar-section"><div class="sidebar-label">Conversations</div></div>
<div class="chat-list" id="chatList" aria-label="Conversation history"></div>

<div class="sidebar-bottom">
<div class="api-status" aria-live="polite">
<span class="status-dot" id="statusDot"></span>
<span id="statusText">API key not configured</span>
</div>
<button class="small-btn" style="width:100%" id="settingsBtn" type="button">
<span class="material-symbols-rounded" aria-hidden="true">settings</span>Settings
</button>
</div>
</aside>

<div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

<main class="main">

<header class="topbar" aria-label="Studio controls">
<div class="top-left">

<button class="icon-btn mobile-menu" id="mobileMenuBtn" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
<span class="material-symbols-rounded" aria-hidden="true">menu</span>
</button>

<select class="model-select" id="modelSelect" aria-label="Gemini model" title="Gemini model">
<option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
<option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
<option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
<option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
<option value="gemini-3.1-pro-preview">Gemini 3.1 Pro</option>
<option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
<option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
<option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
</select>

<select class="thinking-select" id="thinkingSelect" aria-label="Thinking level" title="Thinking level">
<option value="low">🧠 Thinking: Low</option>
<option value="medium" selected>🧠 Thinking: Medium</option>
<option value="high">🧠 Thinking: High</option>
</select>

</div>

<div class="top-right">

<select class="mode-select" id="modeSelect" aria-label="Coding mode">
<option value="generate">Generate</option>
<option value="modify">Modify</option>
<option value="debug">Debug</option>
<option value="refactor">Refactor</option>
<option value="review">Review</option>
<option value="explain">Explain</option>
<option value="optimize">Optimize</option>
<option value="convert">Convert</option>
</select>

<button class="icon-btn" id="clearBtn" type="button" title="Clear conversation" aria-label="Clear conversation">
<span class="material-symbols-rounded" aria-hidden="true">delete_sweep</span>
</button>

<button class="icon-btn" id="settingsTopBtn" type="button" title="Settings" aria-label="Settings">
<span class="material-symbols-rounded" aria-hidden="true">settings</span>
</button>

</div>
</header>

<section class="chat" id="chat" aria-label="Conversation">
<div class="chat-inner" id="chatInner">

<div class="welcome" id="welcome">
<div class="welcome-card">
<div class="welcome-logo" aria-hidden="true">✦</div>
<h1>What are we coding?</h1>
<p>Generate, modify, debug, refactor, review and optimize practically any type of code with Gemini.</p>

<div class="suggestions">
<button class="suggestion" type="button" data-prompt="Build a production-grade full-stack application. Explain the architecture first, then provide the complete implementation."><strong>Build an application</strong>Start a complete production-grade project.</button>
<button class="suggestion" type="button" data-prompt="Analyze the supplied code deeply. Find bugs, security problems, performance issues and architectural problems, then provide a corrected version."><strong>Debug my code</strong>Find bugs and provide corrected code.</button>
<button class="suggestion" type="button" data-prompt="Refactor the supplied code for production use. Preserve behavior while improving architecture, maintainability, performance, security and error handling."><strong>Refactor code</strong>Upgrade existing code without unnecessary changes.</button>
<button class="suggestion" type="button" data-prompt="Perform a deep engineering review of the supplied code. Identify correctness, security, performance, scalability and maintainability issues."><strong>Review code</strong>Perform a serious engineering review.</button>
</div>
</div>
</div>

</div>
</section>

<div class="composer-zone">
<div class="composer" id="composer">

<div class="editor-tabs">
<button class="tab active" id="codeTab" type="button">Code</button>
<button class="tab" id="textTab" type="button">Text</button>
<button class="tab" id="fileTab" type="button">File</button>
</div>

<div class="code-input-wrap">
<textarea id="codeInput" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" aria-label="Code or text input" placeholder="Paste your code here — up to 80,000 lines."></textarea>
<input id="fileInput" type="file" hidden multiple>
</div>

<textarea id="promptInput" class="prompt-input" rows="1" aria-label="Task description" placeholder="Describe what you want Gemini to do with the code..."></textarea>

<div class="composer-bottom">
<div class="composer-left">

<button class="small-btn" id="attachBtn" type="button">
<span class="material-symbols-rounded" aria-hidden="true">attach_file</span>Attach
</button>

<button class="small-btn" id="pasteBtn" type="button">
<span class="material-symbols-rounded" aria-hidden="true">content_paste</span>Paste
</button>

<span class="counter" id="counter">0 lines · 0 chars</span>

</div>

<div class="composer-right">

<button class="small-btn" id="clearInputBtn" type="button">
<span class="material-symbols-rounded" aria-hidden="true">clear_all</span>Clear
</button>

<button class="send-btn" id="sendBtn" type="button" title="Send" aria-label="Send">
<span class="material-symbols-rounded" aria-hidden="true">arrow_upward</span>
</button>

</div>
</div>
</div>
</div>

</main>
</div>

<div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
<div class="modal-card">

<div class="modal-head">
<div class="modal-title" id="settingsTitle">Gemini Settings</div>
<button class="icon-btn" id="closeSettings" type="button" aria-label="Close settings">
<span class="material-symbols-rounded" aria-hidden="true">close</span>
</button>
</div>

<div class="modal-body">

<div class="field">
<label for="apiKeyInput">Gemini API Key</label>
<input id="apiKeyInput" type="password" autocomplete="off" placeholder="AIza...">
</div>

<div class="field">
<label for="systemInput">Power System Role</label>
<textarea id="systemInput"></textarea>
</div>

<div class="field">
<label for="maxTokensInput">Maximum output tokens</label>
<input id="maxTokensInput" type="number" min="256" max="65536" value="65536">
</div>

<div class="modal-actions">
<button class="secondary-btn" id="cancelSettings" type="button">Cancel</button>
<button class="primary-btn" id="saveSettings" type="button">Save settings</button>
</div>

</div>
</div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import{GoogleGenAI}from"https://esm.sh/@google/genai@latest";

const DEFAULT_MODEL="gemini-3.8-flash",MAX_CODE_LINES=80000,MAX_CODE_CHARS=12000000,DEFAULT_MAX_OUTPUT=65536,DEFAULT_THINKING_LEVEL="medium",STORAGE={apiKey:"gemini_code_studio_api_key",model:"gemini_code_studio_model",thinking:"gemini_code_studio_thinking",system:"gemini_code_studio_system",maxTokens:"gemini_code_studio_max_tokens"},DEFAULT_SYSTEM_ROLE=`
You are Gemini Code Power Studio, a senior principal software engineer, software architect, security engineer, performance engineer and debugging specialist.

Your primary purpose is to generate, modify, repair, refactor, review, explain, optimize, migrate and architect software.

CORE ENGINEERING RULES

1. Treat supplied source code as authoritative input.
2. Preserve existing functionality unless the user explicitly requests behavioral changes.
3. Never silently remove important functionality.
